<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campusly - Admin SQL Generator</title>
    <style>
        :root {
            --primary: #E83E8C;
            --primary-hover: #D02B78;
            --secondary: #7C4DFF;
            --bg-main: #F8F7FA;
            --surface: #FFFFFF;
            --text-main: #171525;
            --text-muted: #8B8894;
            --border: #E5E3EB;
            --radius: 12px;
            --shadow: 0 8px 24px -4px rgba(23, 21, 37, 0.08);
        }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background: var(--bg-main); 
            color: var(--text-main); 
            padding: 40px 20px; 
            max-width: 1000px; 
            margin: auto; 
            line-height: 1.5;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 2.5rem;
            margin: 0;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .box { 
            background: var(--surface); 
            padding: 30px; 
            border-radius: var(--radius); 
            box-shadow: var(--shadow); 
            margin-bottom: 30px; 
            border: 1px solid var(--border); 
        }

        .box-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border);
        }

        .box-header h2 { 
            color: var(--text-main); 
            margin: 0; 
            font-size: 1.25rem;
        }

        label { 
            display: block; 
            font-weight: 600; 
            margin-bottom: 6px; 
            font-size: 0.85rem; 
            color: var(--text-muted); 
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input[type="text"], input[type="number"], select { 
            width: 100%; 
            padding: 12px 16px; 
            border: 2px solid var(--border); 
            border-radius: 8px; 
            box-sizing: border-box; 
            font-size: 0.95rem;
            transition: all 0.2s;
            background: var(--bg-main);
            color: var(--text-main);
            font-weight: 500;
        }

        input:focus, select:focus {
            border-color: var(--primary);
            outline: none;
            background: var(--surface);
            box-shadow: 0 0 0 4px rgba(232, 62, 140, 0.1);
        }

        .row { 
            display: flex; 
            gap: 15px; 
            margin-bottom: 15px; 
            align-items: flex-end; 
            padding-bottom: 20px; 
            border-bottom: 1px dashed var(--border); 
        }
        .row > div { flex: 1; }
        .row:last-child { border-bottom: none; padding-bottom: 0; }

        button { 
            background: var(--primary); 
            color: white; 
            border: none; 
            padding: 14px 24px; 
            border-radius: 8px; 
            cursor: pointer; 
            font-weight: 700; 
            font-size: 1rem;
            transition: transform 0.1s, box-shadow 0.2s; 
            box-shadow: 0 4px 12px rgba(232, 62, 140, 0.3);
        }
        button:hover { 
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(232, 62, 140, 0.4);
        }
        button:active { transform: translateY(0); }

        button.add-btn { background: #10b981; box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3); margin-bottom: 20px;}
        button.add-btn:hover { background: #059669; box-shadow: 0 6px 16px rgba(16, 185, 129, 0.4); }
        
        .remove-btn { 
            background: #fee2e2; 
            color: #ef4444; 
            padding: 12px; 
            width: 45px; 
            text-align: center; 
            box-shadow: none;
        }
        .remove-btn:hover { background: #fca5a5; color: white; box-shadow: none; }

        textarea { 
            width: 100%; 
            height: 250px; 
            padding: 16px; 
            font-family: 'JetBrains Mono', 'Courier New', Courier, monospace; 
            border: none; 
            border-radius: 8px; 
            box-sizing: border-box; 
            resize: vertical; 
            background: #171525; 
            color: #34d399; 
            font-size: 0.95rem;
            line-height: 1.5;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);
        }

        /* Modalità Principali */
        #mode_uni, #mode_course { display: none; animation: fadeIn 0.3s ease; }
        body.show-uni #mode_uni { display: block; }
        body.show-course #mode_course { display: block; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Template API Dinamici */
        .tpl-cineca, .tpl-easystaff, .tpl-custom { display: none; gap: 10px; }
        #mode_course.show-tpl-cineca .tpl-cineca { display: flex; flex: 2; }
        #mode_course.show-tpl-easystaff .tpl-easystaff { display: flex; flex: 2.5; }
        #mode_course.show-tpl-custom .tpl-custom { display: block; flex: 2; }

        .api-selector-box {
            background: rgba(124, 77, 255, 0.05);
            border: 1px solid rgba(124, 77, 255, 0.2);
            padding: 15px 20px;
            border-radius: 8px;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 15px;
        }
    </style>
</head>
<body class="show-uni">

    <div class="header">
        <h1>Campusly Admin Tool</h1>
        <p style="color: var(--text-muted); font-weight: 500;">Generatore SQL Rapido per il Database</p>
    </div>

    <!-- SELETTORE MODALITÀ -->
    <div class="box" style="padding: 20px 30px;">
        <div style="display: flex; align-items: center; gap: 20px;">
            <div style="font-size: 2rem;">⚙️</div>
            <div style="flex: 1;">
                <label style="color: var(--text-main); font-size: 1rem;">Cosa vuoi inserire nel database?</label>
                <select id="mode_selector" onchange="cambiaModalita()" style="font-size: 1.05rem; padding: 10px; font-weight: bold; max-width: 400px;">
                    <option value="uni">🏛️ Nuova Università (Anagrafica)</option>
                    <option value="course">📚 Nuovo Corso e Curriculum</option>
                </select>
            </div>
        </div>
    </div>

    <!-- MODALITÀ 1: UNIVERSITÀ -->
    <div id="mode_uni" class="box">
        <div class="box-header">
            <span style="font-size: 1.5rem;">🏛️</span>
            <h2>Dettagli Ateneo</h2>
        </div>
        <div class="row">
            <div style="flex: 2;">
                <label>Nome Ateneo</label>
                <input type="text" id="u_name" placeholder="Es. Politecnico di Milano">
            </div>
            <div>
                <label>Dominio Email</label>
                <input type="text" id="u_domain" placeholder="Es. polimi.it">
            </div>
        </div>
        <div class="row" style="border: none;">
            <div>
                <label>Classe Adapter (Traduttore PHP)</label>
                <input type="text" id="u_adapter" placeholder="Es. App\Adapters\PoliMiAdapter">
            </div>
            <div>
                <label>Percorso Logo</label>
                <input type="text" id="u_logo" placeholder="Es. /assets/img/logo-polimi.png">
            </div>
        </div>
        <div style="text-align: right; margin-top: 20px;">
            <button type="button" onclick="generaSQLUni()">Genera SQL Università</button>
        </div>
    </div>

    <!-- MODALITÀ 2: CORSI E CURRICULUM -->
    <div id="mode_course" class="show-tpl-cineca">
        <div class="box">
            <div class="box-header">
                <span style="font-size: 1.5rem;">📚</span>
                <h2>Anagrafica Generale del Corso</h2>
            </div>
            <div class="row" style="border: none;">
                <div style="flex: 0.5;">
                    <label>ID Uni</label>
                    <input type="number" id="c_uni_id" placeholder="Es. 1">
                </div>
                <div style="flex: 2;">
                    <label>Nome Corso</label>
                    <input type="text" id="c_name" placeholder="Es. Ingegneria Informatica">
                </div>
                <div style="flex: 1;">
                    <label>Dipartimento (Opz.)</label>
                    <input type="text" id="c_dep" placeholder="Es. DISUIT">
                </div>
            </div>
        </div>

        <div class="box">
            <div class="box-header">
                <span style="font-size: 1.5rem;">📍</span>
                <h2>Varianti (Sedi e Anni)</h2>
            </div>
            
            <div class="api-selector-box">
                <label style="margin: 0; color: var(--secondary);">Formato API Esterna:</label>
                <select id="api_template" onchange="cambiaTemplateAPI()" style="max-width: 300px; padding: 8px; font-weight: bold; border-color: var(--secondary);">
                    <option value="cineca">Cineca UP (Es. Insubria)</option>
                    <option value="easystaff">EasyStaff (Es. Statale)</option>
                    <option value="custom">JSON Personalizzato</option>
                </select>
            </div>

            <div id="curriculums-container">
                <!-- Riga Base -->
                <div class="row curr-row">
                    <div>
                        <label>Sede</label>
                        <input type="text" class="v_sede" placeholder="Es. Varese" required>
                    </div>
                    <div style="flex: 0.5;">
                        <label>Anno</label>
                        <input type="number" class="v_anno" placeholder="1" required>
                    </div>

                    <!-- CAMPI CINECA -->
                    <div class="tpl-cineca">
                        <div style="flex:1;">
                            <label>linkCalendarioId</label>
                            <input type="text" class="c_link" placeholder="Es. 5E75A...">
                        </div>
                        <div style="flex:1;">
                            <label>clienteId</label>
                            <!-- PRECOMPILATO CON IL VALORE DI DEFAULT -->
                            <input type="text" class="c_cliente" value="59f05192a635f443422fe8fd">
                        </div>
                    </div>

                    <!-- CAMPI EASYSTAFF -->
                    <div class="tpl-easystaff">
                        <div style="flex:1;">
                            <label>Cod. Corso (corso)</label>
                            <input type="text" class="e_corso" placeholder="Es. BAE">
                        </div>
                        <div style="flex:1;">
                            <label>Curriculum (anno2)</label>
                            <input type="text" class="e_curr" placeholder="Es. BAE-0|2">
                        </div>
                        <div style="flex: 0.5;">
                            <label>A.A.</label>
                            <input type="text" class="e_aa" value="2026">
                        </div>
                    </div>

                    <!-- CAMPI CUSTOM -->
                    <div class="tpl-custom">
                        <label>API Config (JSON RAW)</label>
                        <input type="text" class="v_json" placeholder='Es. {"chiave": "valore"}'>
                    </div>
                </div>
            </div>
            
            <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 10px;">
                <button type="button" class="add-btn" onclick="aggiungiRigaVariante()">+ Aggiungi Variante</button>
                <button type="button" onclick="generaSQLCorso()">Genera SQL Corso</button>
            </div>
        </div>
    </div>

    <!-- OUTPUT COMUNE -->
    <div class="box">
        <div class="box-header">
            <span style="font-size: 1.5rem;">💾</span>
            <h2>Output SQL Pronto</h2>
        </div>
        <textarea id="sql_output" readonly placeholder="Il codice SQL generato apparirà qui, pronto da copiare..."></textarea>
    </div>

<script>
    // Gestione Switch Modalità Principale
    function cambiaModalita() {
        const mode = document.getElementById('mode_selector').value;
        document.body.className = 'show-' + mode;
        document.getElementById('sql_output').value = '';
    }

    // Gestione Switch Template API
    function cambiaTemplateAPI() {
        const tpl = document.getElementById('api_template').value;
        document.getElementById('mode_course').className = 'show-tpl-' + tpl;
    }

    // Aggiungi righe dinamiche
    function aggiungiRigaVariante() {
        const container = document.getElementById('curriculums-container');
        const primaRiga = container.querySelector('.curr-row');
        const nuovaRiga = primaRiga.cloneNode(true);
        
        // Pulisci i campi
        nuovaRiga.querySelector('.v_anno').value = '';
        nuovaRiga.querySelector('.c_link').value = '';
        
        // Mantiene il valore precompilato fisso per Cineca
        nuovaRiga.querySelector('.c_cliente').value = '59f05192a635f443422fe8fd';
        
        nuovaRiga.querySelector('.e_corso').value = '';
        nuovaRiga.querySelector('.e_curr').value = '';
        nuovaRiga.querySelector('.v_json').value = '';
        
        // Bottone rimuovi stile premium
        if (!nuovaRiga.querySelector('.remove-btn')) {
            const btnDiv = document.createElement('div');
            btnDiv.style.flex = "0 0 auto";
            btnDiv.innerHTML = `<button type="button" class="remove-btn" title="Rimuovi" onclick="this.parentElement.parentElement.remove()">✕</button>`;
            nuovaRiga.appendChild(btnDiv);
        }
        container.appendChild(nuovaRiga);
    }

    // Generatore SQL Università
    function generaSQLUni() {
        const name = document.getElementById('u_name').value.replace(/'/g, "''");
        const domain = document.getElementById('u_domain').value.replace(/'/g, "''");
        const adapter = document.getElementById('u_adapter').value.replace(/'/g, "''").replace(/\\/g, "\\\\");
        const logo = document.getElementById('u_logo').value.replace(/'/g, "''");

        if (!name || !adapter) {
            alert('Attenzione: Nome e Adapter sono obbligatori!');
            return;
        }

        const sql = `INSERT INTO universities (name, domain, adapter_class, is_active, logo_path) \nVALUES ('${name}', ${domain ? "'"+domain+"'" : "NULL"}, '${adapter}', 1, ${logo ? "'"+logo+"'" : "NULL"});`;
        document.getElementById('sql_output').value = sql;
    }

    // Generatore SQL Corsi e Curriculum
    function generaSQLCorso() {
        const uniId = document.getElementById('c_uni_id').value;
        const name = document.getElementById('c_name').value.replace(/'/g, "''");
        const dep = document.getElementById('c_dep').value.replace(/'/g, "''");
        const tpl = document.getElementById('api_template').value;
        
        if (!uniId || !name) {
            alert('Attenzione: ID Università e Nome Corso sono obbligatori!');
            return;
        }

        let sql = `-- Creazione Anagrafica Corso\n`;
        sql += `INSERT INTO courses (university_id, name, department) \nVALUES (${uniId}, '${name}', ${dep ? "'"+dep+"'" : "NULL"});\n`;
        sql += `SET @course_id = LAST_INSERT_ID();\n\n`;
        
        const righe = document.querySelectorAll('.curr-row');
        let values = [];
        
        righe.forEach(r => {
            const sede = r.querySelector('.v_sede').value.replace(/'/g, "''");
            const anno = r.querySelector('.v_anno').value;
            let jsonString = '';

            // Formattazione JSON Automatica in base al template scelto
            if (tpl === 'cineca') {
                const link = r.querySelector('.c_link').value.replace(/'/g, "''");
                const cliente = r.querySelector('.c_cliente').value.replace(/'/g, "''");
                if (link && cliente) jsonString = `{"linkCalendarioId": "${link}", "clienteId": "${cliente}"}`;
            } 
            else if (tpl === 'easystaff') {
                const corso = r.querySelector('.e_corso').value.replace(/'/g, "''");
                const curr = r.querySelector('.e_curr').value.replace(/'/g, "''");
                const aa = r.querySelector('.e_aa').value;
                if (corso && curr) jsonString = `{"corso": "${corso}", "anno2": "${curr}", "anno": "${aa}"}`;
            } 
            else {
                jsonString = r.querySelector('.v_json').value.replace(/'/g, "''");
            }

            if (sede && anno && jsonString) {
                values.push(`(@course_id, '${sede}', ${anno}, '${jsonString}')`);
            }
        });
        
        if (values.length > 0) {
            sql += `-- Inserimento Varianti (Sede / Anno)\n`;
            sql += `INSERT INTO course_curriculums (course_id, campus_location, year, api_config) VALUES \n`;
            sql += values.join(',\n') + ';\n';
            document.getElementById('sql_output').value = sql;
        } else {
            document.getElementById('sql_output').value = sql + "-- ATTENZIONE: Nessuna variante generata. Assicurati di aver compilato tutti i campi richiesti.";
        }
    }
</script>

</body>
</html>
