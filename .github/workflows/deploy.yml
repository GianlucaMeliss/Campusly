name: Deploy to Altervista via FTP

on:
  push:
    branches:
      - main

jobs:
  test:
    name: 🧪 Pre-Deploy Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
      - name: 🔍 Sintassi PHP
        run: find app config public views tests -name "*.php" -print0 | xargs -0 -n1 php -l
      - name: 🧪 Test Unitari
        run: php tests/run.php

  web-deploy:
    name: 🎉 Deploy
    needs: test
    runs-on: ubuntu-latest
    
    steps:
      - name: 🚚 Scarica il codice dal repo
        uses: actions/checkout@v4
      
      - name: 📂 Sincronizza i file via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /Campusly/
          exclude: |
            **/.DS_Store
            app/logs/**
            data/cache/*.json
            data/cache/*.tmp
            database/**
            tests/**
            tools/**
            AI_INSTRUCTIONS.md
            CAMPUSLY_TODO_MIGLIORAMENTI.md
            repomix-final.xml
            repomix-output.xml
            .git*
            **/.git*/**
            .github/**
