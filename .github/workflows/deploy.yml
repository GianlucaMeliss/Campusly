name: Deploy to Altervista via FTP

on:
  push:
    branches:
      - main

jobs:
  test:
    name: 🧪 Pre-Deploy Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
      - name: 🔍 Sintassi PHP
        run: find app config public views tests -name "*.php" -print0 | xargs -0 -n1 php -l
      - name: 🧪 Test Unitari
        run: php tests/run.php

  web-deploy:
    name: 🎉 Deploy
    needs: test
    runs-on: ubuntu-latest
    
    steps:
      - name: 🚚 Scarica il codice dal repo
        uses: actions/checkout@v4

      - name: ⚙️ Genera config/local.php da GitHub Secrets
        env:
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}
          SITE_URL: ${{ secrets.SITE_URL }}
          CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          TRUSTED_PROXIES: ${{ secrets.TRUSTED_PROXIES }}
        run: |
          php -r '
          $envOrDefault = function (string $key, string $default): string {
              $val = trim((string)getenv($key));
              return $val !== "" ? $val : $default;
          };
          $proxiesRaw = trim((string)getenv("TRUSTED_PROXIES"));
          $proxies = $proxiesRaw === "" ? [] : array_values(array_filter(array_map("trim", explode(",", $proxiesRaw))));
          $cfg = [
              "site" => [
                  "url" => rtrim($envOrDefault("SITE_URL", "https://gianlucamelis.altervista.org/Campusly"), "/"),
              ],
              "db" => [
                  "host" => "localhost",
                  "name" => $envOrDefault("DB_NAME", "my_gianlucamelis"),
                  "user" => $envOrDefault("DB_USER", "gianlucamelis"),
                  "pass" => (string)getenv("DB_PASS"),
                  "charset" => "utf8mb4",
              ],
              "mail" => [
                  "from" => $envOrDefault("MAIL_FROM", "noreply@gianlucamelis.altervista.org"),
                  "contact_email" => $envOrDefault("CONTACT_EMAIL", "melis.gianlucagm@gmail.com"),
              ],
              "security" => [
                  "trusted_proxies" => $proxies,
              ],
          ];
          $code = "<?php\ndeclare(strict_types=1);\n\nreturn " . var_export($cfg, true) . ";\n";
          if (file_put_contents("config/local.php", $code) === false) {
              exit(1);
          }
          '
      
      - name: 📂 Sincronizza i file via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /Campusly/
          exclude: |
            **/.DS_Store
            app/logs/**
            data/cache/*.json
            data/cache/*.tmp
            database/**
            tests/**
            tools/**
            config/local.example.php
            AI_INSTRUCTIONS.md
            CAMPUSLY_TODO_MIGLIORAMENTI.md
            CAMPUSLY_CORREZIONI_RESIDUE.md
            repomix-final.xml
            repomix-output.xml
            .git*
            **/.git*/**
            .github/**
